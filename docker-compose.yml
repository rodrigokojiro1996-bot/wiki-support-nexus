# Support Nexus com Docker Compose: a aplicação + monitoramento (Prometheus coleta, Grafana mostra).
#
#   docker compose up -d --build     sobe tudo (e reconstrói a imagem se o código mudou)
#   docker compose ps                estado e saúde (healthy / unhealthy)
#   docker compose logs -f nexus     acompanha o log de um serviço
#   docker compose down              para e remove os contêineres (os volumes com os dados continuam)
#
#   http://localhost:8010   Support Nexus
#   http://localhost:9090   Prometheus (métricas brutas, alvos, alertas)
#   http://localhost:3000   Grafana (painel "Support Nexus · API"; usuário admin, senha do .env)
#
# Antes da primeira vez: copie .env.example para .env e defina GRAFANA_SENHA.
# Detalhes e explicação de cada escolha: docs/docker.md e docs/monitoramento.md
name: support-nexus

services:
  nexus:
    build: .
    image: support-nexus:local
    # Só esta máquina acessa: ainda não há login. Para liberar na rede troque por "8010:8010"
    # (e leia a seção de segurança de docs/docker.md antes).
    ports:
      - "127.0.0.1:8010:8010"
    environment:
      # o banco grava datas em "hora local" (quem validou, quando): sem isto o contêiner usaria UTC, 3 h adiantado
      TZ: ${NEXUS_FUSO:-America/Sao_Paulo}
    volumes:
      # banco SQLite, manuais e prints criados pela interface: sobrevivem a "down" e a uma imagem nova
      - nexus-dados:/app/backend/dados
      # Banco real (opcional), sempre somente leitura (:ro). Descomente depois de gerar os arquivos:
      # - ./backend/modulos.json:/app/backend/modulos.json:ro
      # - ./coletor/saida:/app/coletor/saida:ro
    # o Chromium usa memória compartilhada; os 64 MB padrão do Docker fazem PDFs grandes falharem
    shm_size: "256m"
    mem_limit: 1g
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.15.1@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d   # guarda 15 dias de métricas
      - --storage.tsdb.retention.size=1GB   # ...ou até 1 GB, o que vier primeiro
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./docker/prometheus:/etc/prometheus:ro   # configuração e regras de alerta (versionadas no git)
      - prometheus-dados:/prometheus             # o histórico das métricas
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:9090/-/ready"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    mem_limit: 512m
    restart: unless-stopped

  grafana:
    image: grafana/grafana-oss:13.0.2@sha256:5dad0df181cb644a14e13617b913b261a54f7d4fd4510721dba420929f35bea2
    depends_on:
      prometheus:
        condition: service_healthy   # só sobe depois que o Prometheus está pronto
    environment:
      GF_SECURITY_ADMIN_USER: admin
      # sem senha definida o compose para com esta mensagem, em vez de usar o admin/admin padrão
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_SENHA:?Defina GRAFANA_SENHA no arquivo .env (copie de .env.example)}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_DEFAULT_LANGUAGE: pt-BR
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/support-nexus.json
      # plugin Infinity: lê a API do GitHub para o painel de branches (versão fixa, instalada ao subir)
      GF_PLUGINS_PREINSTALL_SYNC: yesoreyeram-infinity-datasource@4.1.5
      # sem telemetria nem consultas a servidores externos (atualizações, notícias)
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro   # fonte de dados e onde ficam os painéis
      - ./docker/grafana/dashboards:/etc/grafana/dashboards:ro       # o painel em JSON (gerado por gerar_painel.py)
      - grafana-dados:/var/lib/grafana                               # usuários, preferências, sessões
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    mem_limit: 512m
    restart: unless-stopped

volumes:
  nexus-dados:
  prometheus-dados:
  grafana-dados:
